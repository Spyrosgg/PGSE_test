name: Deploy to GitHub Pages

on:
  # Runs on every push to main
  push:
    branches: [main]
  # Lets you run it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect Pages URL
        id: pages
        uses: actions/configure-pages@v6
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          # Astro 7 needs Node 22.23.4 or newer
          node-version: 24
        env:
          # "" with a custom domain, "/<repo>" on <user>.github.io/<repo>
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
